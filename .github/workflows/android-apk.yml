# 📱 Arma la app «DCANP Delivery» para Android y la publica en
# https://www.el-ecommercedcanpgroup.com/dcanp-delivery.apk
# Se ejecuta sola cuando cambia algo de la app (carpeta android, configuración) o a mano.
name: App Android (DCANP Delivery)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'src/lib/nativeApp.ts'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Dependencias
        run: npm ci --no-audit --no-fund

      - name: Proyecto Android
        run: |
          # La app abre la web publicada; sólo hace falta una página de respaldo.
          mkdir -p dist
          echo '<!doctype html><meta charset="utf-8"><title>DCANP Delivery</title><p>Cargando…</p>' > dist/index.html
          npx cap sync android

      - name: Armar APK
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: dcanp-delivery-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publicar en la web
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk public/dcanp-delivery.apk
          printf '{"version":"1.%s","build":%s,"date":"%s"}\n' "${{ github.run_number }}" "${{ github.run_number }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > public/dcanp-delivery.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/dcanp-delivery.apk public/dcanp-delivery.json
          git commit -m "App Android: versión 1.${{ github.run_number }}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
